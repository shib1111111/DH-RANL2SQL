<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="etitle edesc"><title id="etitle">DH-RANL2SQL executive architecture</title><desc id="edesc">A business question flows to a planner that selects specialist agents, an orchestrator runs them, evidence passes a completeness and quality gate, guarded SQL executes in BigQuery, and a verified answer is returned.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8190A3"/></marker></defs><rect width="1920" height="1080" fill="#F5F7FB"/><rect x="48" y="38" width="1824" height="105" rx="20" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/><text x="82" y="88" font-family="Aptos, Arial, sans-serif" font-size="38" font-weight="850" fill="#17283F" text-anchor="start" letter-spacing="1">DH-RANL2SQL</text><text x="82" y="122" font-family="Aptos, Arial, sans-serif" font-size="20" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">From business questions to trusted analytics</text><rect x="1535" y="74" width="300" height="32" rx="16" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="1685.0" y="96" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#2D65B0" text-anchor="middle" letter-spacing="0">EXECUTIVE OVERVIEW · 16:9</text><rect x="48" y="170" width="1824" height="130" rx="18" fill="#F0ECF8" stroke="#D8CEEA" stroke-width="2"/><text x="82" y="207" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="850" fill="#6950A6" text-anchor="start" letter-spacing="1.1">BUSINESS QUESTION</text><text x="82" y="245" font-family="Aptos, Arial, sans-serif" font-size="25" font-weight="700" fill="#17283F" text-anchor="start" letter-spacing="0">“Average claim amount by sponsor for cases describing delayed approvals last quarter?”</text><text x="82" y="280" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Planner extracts:  AVG(claim amount)   ·   GROUP BY sponsor   ·   last quarter   ·   narrative condition: delayed approval</text><path d="M425 460 L485 460" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M805 460 L865 460" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="48" y="340" width="377" height="245" rx="18" fill="#F0ECF8" stroke="#D8CEEA" stroke-width="2"/><rect x="75" y="362" width="125" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="137.5" y="384" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#6950A6" text-anchor="middle" letter-spacing="0">STEP 1</text><text x="75" y="425" font-family="Aptos, Arial, sans-serif" font-size="27" font-weight="850" fill="#6950A6" text-anchor="start" letter-spacing="0">Query Planner</text><text x="75" y="459" font-family="Aptos, Arial, sans-serif" font-size="27" font-weight="850" fill="#6950A6" text-anchor="start" letter-spacing="0">Agent</text><text x="75" y="500" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">Understands intent and breaks it</text><text x="75" y="524" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">into measures, filters, joins and</text><text x="75" y="548" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">narrative conditions.</text><text x="75" y="570" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="750" fill="#6950A6" text-anchor="start" letter-spacing="0">Selects the agent tools needed.</text><rect x="485" y="340" width="320" height="245" rx="18" fill="#EAF1FB" stroke="#C8D9F0" stroke-width="2"/><rect x="510" y="362" width="125" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="572.5" y="384" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#2D65B0" text-anchor="middle" letter-spacing="0">STEP 2</text><text x="510" y="425" font-family="Aptos, Arial, sans-serif" font-size="27" font-weight="850" fill="#2D65B0" text-anchor="start" letter-spacing="0">Orchestrator</text><text x="510" y="459" font-family="Aptos, Arial, sans-serif" font-size="27" font-weight="850" fill="#2D65B0" text-anchor="start" letter-spacing="0">Agent</text><text x="510" y="500" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">Reads the plan and invokes only</text><text x="510" y="524" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">the selected agents as tools.</text><text x="510" y="555" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Controls order, parallel work,</text><text x="510" y="576" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">retries, budgets and stop rules.</text><rect x="865" y="340" width="1007" height="245" rx="18" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/><rect x="890" y="362" width="125" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="952.5" y="384" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#137F78" text-anchor="middle" letter-spacing="0">STEP 3</text><text x="1030" y="388" font-family="Aptos, Arial, sans-serif" font-size="24" font-weight="850" fill="#137F78" text-anchor="start" letter-spacing="0">Specialist agent tools</text><text x="1030" y="415" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Available capabilities — selected per question, not all run every time</text><rect x="890" y="442" width="225" height="43" rx="11" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="1002.5" y="469" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#2D65B0" text-anchor="middle" letter-spacing="0">Schema &amp; metadata</text><rect x="1135" y="442" width="225" height="43" rx="11" fill="#E8F5F2" stroke="#E8F5F2" stroke-width="1"/><text x="1247.5" y="469" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#137F78" text-anchor="middle" letter-spacing="0">Exact / lexical search</text><rect x="1380" y="442" width="225" height="43" rx="11" fill="#F0ECF8" stroke="#F0ECF8" stroke-width="1"/><text x="1492.5" y="469" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#6950A6" text-anchor="middle" letter-spacing="0">Semantic retrieval</text><rect x="1625" y="442" width="225" height="43" rx="11" fill="#FBF2E5" stroke="#FBF2E5" stroke-width="1"/><text x="1737.5" y="469" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#A9671D" text-anchor="middle" letter-spacing="0">Evidence fusion</text><rect x="890" y="500" width="225" height="43" rx="11" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="1002.5" y="527" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#2D65B0" text-anchor="middle" letter-spacing="0">Semantic evaluation</text><rect x="1135" y="500" width="225" height="43" rx="11" fill="#E8F5F2" stroke="#E8F5F2" stroke-width="1"/><text x="1247.5" y="527" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#137F78" text-anchor="middle" letter-spacing="0">SQL generation</text><rect x="1380" y="500" width="225" height="43" rx="11" fill="#F0ECF8" stroke="#F0ECF8" stroke-width="1"/><text x="1492.5" y="527" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#6950A6" text-anchor="middle" letter-spacing="0">Result verification</text><rect x="1625" y="500" width="225" height="43" rx="11" fill="#FBF2E5" stroke="#FBF2E5" stroke-width="1"/><text x="1737.5" y="527" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#A9671D" text-anchor="middle" letter-spacing="0">Answer synthesis</text><path d="M1368 585 V625 H318 V640" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="650" width="540" height="270" rx="18" fill="#FBF2E5" stroke="#EAD5B7" stroke-width="2"/><rect x="73" y="672" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="138.0" y="694" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#A9671D" text-anchor="middle" letter-spacing="0">STEP 4</text><text x="73" y="738" font-family="Aptos, Arial, sans-serif" font-size="25" font-weight="850" fill="#A9671D" text-anchor="start" letter-spacing="0">Evidence quality gate</text><text x="73" y="782" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Two checks before exact aggregates:</text><text x="93" y="821" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">1.  Full eligible population evaluated?</text><text x="93" y="858" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">2.  Narrative condition quality acceptable?</text><text x="73" y="899" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="750" fill="#B74F43" text-anchor="start" letter-spacing="0">Top-K candidates are not full-population proof.</text><rect x="690" y="650" width="540" height="270" rx="18" fill="#EAF1FB" stroke="#C8D9F0" stroke-width="2"/><rect x="715" y="672" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="780.0" y="694" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#2D65B0" text-anchor="middle" letter-spacing="0">STEP 5</text><text x="715" y="738" font-family="Aptos, Arial, sans-serif" font-size="25" font-weight="850" fill="#2D65B0" text-anchor="start" letter-spacing="0">Guarded SQL + BigQuery</text><text x="715" y="782" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">SQL Generation Agent creates the query.</text><text x="715" y="821" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">SQLGlot validates SELECT-only policy,</text><text x="715" y="848" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">tables, columns, joins and aggregations.</text><text x="715" y="889" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="750" fill="#2D65B0" text-anchor="start" letter-spacing="0">Dry run → read-only execution</text><rect x="1332" y="650" width="540" height="270" rx="18" fill="#E8F5EF" stroke="#B7DDCB" stroke-width="2"/><rect x="1357" y="672" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="1422.0" y="694" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#167A5A" text-anchor="middle" letter-spacing="0">STEP 6</text><text x="1357" y="738" font-family="Aptos, Arial, sans-serif" font-size="25" font-weight="850" fill="#167A5A" text-anchor="start" letter-spacing="0">Verified answer</text><text x="1357" y="782" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">Result Verification Agent checks</text><text x="1357" y="809" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">totals, anomalies and evidence.</text><text x="1357" y="848" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">Answer Synthesis Agent returns:</text><text x="1357" y="878" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="750" fill="#167A5A" text-anchor="start" letter-spacing="0">answer · explanation · SQL · sources · caveats</text><path d="M588 785 L680 785" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1230 785 L1322 785" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="48" y="950" width="825" height="75" rx="14" fill="#FBEDEA" stroke="#E9C4BE" stroke-width="1"/><text x="75" y="980" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="850" fill="#B74F43" text-anchor="start" letter-spacing="1">WHEN THE EVIDENCE GATE FAILS</text><text x="75" y="1008" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Expand evaluation  ·  refresh index  ·  clarify  ·  abstain</text><rect x="895" y="950" width="977" height="75" rx="14" fill="#EEF2F6" stroke="#D8E0EA" stroke-width="1"/><text x="922" y="980" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="850" fill="#21344D" text-anchor="start" letter-spacing="1">CROSS-CUTTING CONTROLS</text><text x="922" y="1008" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Governance  ·  access control  ·  observability  ·  bounded retries  ·  cost limits  ·  freshness</text></svg>