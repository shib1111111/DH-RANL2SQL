<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1880" role="img" aria-labelledby="title desc"><title id="title">DH-RANL2SQL simplified architecture</title><desc id="desc">A question is interpreted by a Query Planner Agent, which selects specialist agent tools. An Orchestrator invokes the selected agents, evidence passes a completeness and quality gate, and safe SQL is executed in BigQuery to produce a verified answer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8190A3"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#24364B" flood-opacity=".07"/></filter></defs><rect width="1600" height="1880" fill="#F5F7FB"/><rect x="65" y="35" width="1470" height="112" rx="22" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/><text x="100" y="82" font-family="Aptos, Arial, sans-serif" font-size="38" font-weight="850" fill="#17283F" text-anchor="start" letter-spacing="1.2">DH-RANL2SQL</text><text x="100" y="116" font-family="Aptos, Arial, sans-serif" font-size="20" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Dynamic Hybrid Retrieval-Augmented NL2SQL</text><rect x="1250" y="75" width="230" height="32" rx="16" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="1365.0" y="97" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#2D65B0" text-anchor="middle" letter-spacing="0">SIMPLIFIED ARCHITECTURE</text><text x="85" y="205" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#2D65B0" text-anchor="start" letter-spacing="1.1">1  ·  START WITH THE BUSINESS QUESTION</text><rect x="80" y="225" width="1440" height="150" rx="20" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/><text x="115" y="270" font-family="Aptos, Arial, sans-serif" font-size="23" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">“What is the average claim amount by sponsor for cases whose notes describe delayed approvals</text><text x="115" y="303" font-family="Aptos, Arial, sans-serif" font-size="23" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">during the last quarter?”</text><rect x="105" y="320" width="330" height="48" rx="11" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="119" y="339" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="800" fill="#2D65B0" text-anchor="start" letter-spacing="0.7">MEASURE</text><text x="119" y="359" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Average claim amount</text><rect x="455" y="320" width="330" height="48" rx="11" fill="#E8F5F2" stroke="#E8F5F2" stroke-width="1"/><text x="469" y="339" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="800" fill="#137F78" text-anchor="start" letter-spacing="0.7">GROUP BY</text><text x="469" y="359" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Sponsor</text><rect x="805" y="320" width="330" height="48" rx="11" fill="#FBF2E5" stroke="#FBF2E5" stroke-width="1"/><text x="819" y="339" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="800" fill="#A9671D" text-anchor="start" letter-spacing="0.7">TIME FILTER</text><text x="819" y="359" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Last quarter</text><rect x="1155" y="320" width="330" height="48" rx="11" fill="#F0ECF8" stroke="#F0ECF8" stroke-width="1"/><text x="1169" y="339" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="800" fill="#6950A6" text-anchor="start" letter-spacing="0.7">NARRATIVE CONDITION</text><text x="1169" y="359" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="650" fill="#17283F" text-anchor="start" letter-spacing="0">Delayed approvals</text><path d="M800 375 L800 411" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="85" y="445" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#6950A6" text-anchor="start" letter-spacing="1.1">2  ·  PLAN THE WORK</text><rect x="145" y="465" width="1310" height="145" rx="20" fill="#F0ECF8" stroke="#D7CBEA" stroke-width="2"/><rect x="180" y="486" width="165" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="262.5" y="508" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#6950A6" text-anchor="middle" letter-spacing="0">ADK · GEMINI</text><text x="375" y="514" font-family="Aptos, Arial, sans-serif" font-size="29" font-weight="850" fill="#6950A6" text-anchor="start" letter-spacing="0">Query Planner Agent</text><text x="185" y="550" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">Understands the question, identifies required operations, and selects which specialist agent tools are needed.</text><text x="185" y="583" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Outputs a typed execution plan: selected agents · dependencies · order · constraints · stop conditions.</text><path d="M800 610 L800 646" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="85" y="680" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#2D65B0" text-anchor="start" letter-spacing="1.1">3  ·  COORDINATE EXECUTION</text><rect x="145" y="700" width="1310" height="125" rx="20" fill="#EAF1FB" stroke="#C8D9F0" stroke-width="2"/><rect x="180" y="720" width="160" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="260.0" y="742" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#2D65B0" text-anchor="middle" letter-spacing="0">CONTROL PLANE</text><text x="375" y="747" font-family="Aptos, Arial, sans-serif" font-size="28" font-weight="850" fill="#2D65B0" text-anchor="start" letter-spacing="0">Orchestrator Agent</text><text x="185" y="784" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">Reads the plan and invokes the selected specialist agents as callable tools.</text><text x="185" y="812" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Manages dependencies, parallel calls, shared state, retries, timeouts, budgets and stopping rules.</text><path d="M800 825 L800 860" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="85" y="895" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#137F78" text-anchor="start" letter-spacing="1.1">4  ·  SPECIALIST AGENTS AVAILABLE TO THE ORCHESTRATOR</text><text x="1510" y="895" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="550" fill="#5C6B7E" text-anchor="end" letter-spacing="0">Only the agents needed for this question are invoked.</text><rect x="80" y="915" width="1440" height="310" rx="20" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/><rect x="105" y="940" width="420" height="76" rx="13" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="123" y="969" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#2D65B0" text-anchor="start" letter-spacing="0">A1  Schema &amp; Metadata Agent</text><text x="123" y="996" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Finds approved tables, columns, metrics and joins.</text><rect x="590" y="940" width="420" height="76" rx="13" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="1"/><text x="608" y="969" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#21344D" text-anchor="start" letter-spacing="0">A2  Exact Match Agent</text><text x="608" y="996" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Finds IDs, codes, known phrases and rules.</text><rect x="1075" y="940" width="420" height="76" rx="13" fill="#E8F5F2" stroke="#E8F5F2" stroke-width="1"/><text x="1093" y="969" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#137F78" text-anchor="start" letter-spacing="0">A3  Lexical Search Agent</text><text x="1093" y="996" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Uses BigQuery SEARCH for word / phrase matches.</text><rect x="105" y="1030" width="420" height="76" rx="13" fill="#F0ECF8" stroke="#F0ECF8" stroke-width="1"/><text x="123" y="1059" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#6950A6" text-anchor="start" letter-spacing="0">A4  Semantic Retrieval Agent</text><text x="123" y="1086" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Finds meaning-based matches with embeddings.</text><rect x="590" y="1030" width="420" height="76" rx="13" fill="#FBF2E5" stroke="#FBF2E5" stroke-width="1"/><text x="608" y="1059" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#A9671D" text-anchor="start" letter-spacing="0">A5  Evidence Fusion Agent</text><text x="608" y="1086" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Combines, ranks and deduplicates evidence.</text><rect x="1075" y="1030" width="420" height="76" rx="13" fill="#F0ECF8" stroke="#F0ECF8" stroke-width="1"/><text x="1093" y="1059" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#6950A6" text-anchor="start" letter-spacing="0">A6  Semantic Evaluation Agent</text><text x="1093" y="1086" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Tests the narrative condition on candidate rows.</text><rect x="105" y="1120" width="420" height="76" rx="13" fill="#EAF1FB" stroke="#EAF1FB" stroke-width="1"/><text x="123" y="1149" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#2D65B0" text-anchor="start" letter-spacing="0">A7  SQL Generation Agent</text><text x="123" y="1176" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Builds SELECT SQL from approved schema and predicates.</text><rect x="590" y="1120" width="420" height="76" rx="13" fill="#E8F5F2" stroke="#E8F5F2" stroke-width="1"/><text x="608" y="1149" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#137F78" text-anchor="start" letter-spacing="0">A8  Result Verification Agent</text><text x="608" y="1176" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Checks totals, anomalies and evidence alignment.</text><rect x="1075" y="1120" width="420" height="76" rx="13" fill="#FBF2E5" stroke="#FBF2E5" stroke-width="1"/><text x="1093" y="1149" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#A9671D" text-anchor="start" letter-spacing="0">A9  Answer Synthesis Agent</text><text x="1093" y="1176" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="550" fill="#5C6B7E" text-anchor="start" letter-spacing="0">Explains the result with SQL, evidence and caveats.</text><rect x="630" y="1190" width="340" height="32" rx="16" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="1"/><text x="800.0" y="1212" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#21344D" text-anchor="middle" letter-spacing="0">AGENTS ARE CALLED AS TOOLS</text><path d="M800 1225 L800 1255" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="80" y="1260" width="1440" height="82" rx="16" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/><text x="110" y="1290" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="800" fill="#5C6B7E" text-anchor="start" letter-spacing="1">EXAMPLE ROUTE FOR THIS QUESTION</text><text x="110" y="1320" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="700" fill="#17283F" text-anchor="start" letter-spacing="0">Schema  &gt;  Lexical + Semantic Search  &gt;  Evidence Fusion  &gt;  Semantic Evaluation  &gt;  SQL  &gt;  Verification  &gt;  Answer</text><path d="M800 1342 L800 1370" fill="none" stroke="#8190A3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="85" y="1400" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="800" fill="#A9671D" text-anchor="start" letter-spacing="1.0">5  ·  CHECK THAT THE EVIDENCE IS SAFE TO AGGREGATE</text><rect x="145" y="1420" width="1310" height="112" rx="18" fill="#FBF2E5" stroke="#EAD5B7" stroke-width="2"/><text x="185" y="1458" font-family="Aptos, Arial, sans-serif" font-size="25" font-weight="850" fill="#A9671D" text-anchor="start" letter-spacing="0">Completeness &amp; quality gate</text><text x="185" y="1491" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">Are we evaluating the full eligible population?   ·   Is the narrative predicate accurate enough for this use?</text><text x="185" y="1518" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="700" fill="#B74F43" text-anchor="start" letter-spacing="0">Top-K search results are candidates — not proof of complete population coverage.</text><path d="M520 1532 L520 1560" fill="none" stroke="#167A5A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1080 1532 L1080 1560" fill="none" stroke="#B74F43" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="80" y="1565" width="900" height="135" rx="17" fill="#E8F5EF" stroke="#B7DDCB" stroke-width="2"/><rect x="110" y="1580" width="160" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="190.0" y="1602" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#167A5A" text-anchor="middle" letter-spacing="0">PASS</text><text x="290" y="1606" font-family="Aptos, Arial, sans-serif" font-size="22" font-weight="850" fill="#167A5A" text-anchor="start" letter-spacing="0">Generate and run the SQL</text><text x="115" y="1640" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#17283F" text-anchor="start" letter-spacing="0">SQL Generation Agent  &gt;  SQLGlot / SELECT-only policy checks</text><text x="115" y="1671" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="600" fill="#5C6B7E" text-anchor="start" letter-spacing="0">&gt;  BigQuery dry run  &gt;  read-only query execution</text><rect x="1010" y="1565" width="510" height="135" rx="17" fill="#FBEDEA" stroke="#E9C4BE" stroke-width="2"/><rect x="1040" y="1580" width="160" height="32" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="1120.0" y="1602" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#B74F43" text-anchor="middle" letter-spacing="0">NOT PASSED</text><text x="1040" y="1625" font-family="Aptos, Arial, sans-serif" font-size="22" font-weight="850" fill="#B74F43" text-anchor="start" letter-spacing="0">Recover safely</text><text x="1040" y="1655" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">Expand evaluation · refresh index</text><text x="1040" y="1680" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="550" fill="#17283F" text-anchor="start" letter-spacing="0">Clarify the question · or abstain</text><path d="M530 1700 L530 1725" fill="none" stroke="#167A5A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="190" y="1730" width="1220" height="82" rx="18" fill="#FFFFFF" stroke="#B7DDCB" stroke-width="2"/><text x="225" y="1762" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="800" fill="#167A5A" text-anchor="start" letter-spacing="1">6  ·  VERIFY &amp; RESPOND</text><text x="225" y="1793" font-family="Aptos, Arial, sans-serif" font-size="17" font-weight="700" fill="#17283F" text-anchor="start" letter-spacing="0">Result Verification Agent  &gt;  Answer Synthesis Agent  &gt;  Result + explanation + SQL + evidence + caveats</text><rect x="65" y="1828" width="1470" height="38" rx="12" fill="#EEF2F6" stroke="#D8E0EA" stroke-width="1"/><text x="90" y="1853" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="700" fill="#5C6B7E" text-anchor="start" letter-spacing="0">ALWAYS ON: access controls  ·  governed metadata  ·  bounded retries  ·  observability  ·  cost limits  ·  index freshness</text></svg>